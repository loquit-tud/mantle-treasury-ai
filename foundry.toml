[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["contracts/lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
skip = ["contracts/lib/openzeppelin-contracts/certora/**", "contracts/lib/openzeppelin-contracts/scripts/**", "contracts/lib/openzeppelin-contracts/test/**"]
remappings = [
  "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
  "forge-std/=contracts/lib/forge-std/src/",
]

[profile.default.fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
mantle = "${MANTLE_RPC_URL}"
mantle_sepolia = "${MANTLE_SEPOLIA_RPC_URL}"
